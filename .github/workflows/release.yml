# =============================================================================
# ADR-001: ScribbleX applicationId identity
# =============================================================================
# Context: ScribbleX is a fully independent fork of NotallyX (itself a fork of
# Notally). Upstream git history was dropped; distribution is GitHub Releases +
# F-Droid only; there is no GMS dependency and no need for an upgrade path from
# upstream NotallyX.
#
# Options:
#   A) Keep `com.philkes.notallyx` (inherited identity).
#      + Existing NotallyX users could upgrade in place.
#      - Ships the fork under someone else's identity; F-Droid/Play listings,
#        backup file ownership, and update channels would collide with upstream.
#      - NotallyX updates from upstream would overwrite/conflict with ScribbleX.
#   B) New identity `com.scribblex.app`.  <-- DECIDED
#      + ScribbleX is published as its own app with its own update path.
#      + No namespace collision with upstream on any store.
#      - Existing NotallyX users cannot upgrade in place; they must export a
#        backup from NotallyX and import it in ScribbleX. The app ships
#        import-from-other-app support for exactly this: NotallyX/Notally
#        backups (utils/backup/ImportExtensions.kt) plus Evernote, Google Keep,
#        Quillpad, plain text and markdown (data/imports/). Document this in the
#        README and F-Droid description.
#
# Decision: applicationId = `com.scribblex.app` (set in app/build.gradle.kts).
# The `namespace` intentionally remains `com.philkes.notallyx`: it is a build
# detail (R/BuildConfig package + manifest resolution for the existing source
# tree), not user-visible identity; renaming it would require relocating every
# source file for no user-facing benefit.
#
# BETA split preserved: the `beta` buildType keeps applicationIdSuffix ".beta"
# (separate app + data slot from release), as in upstream.
# =============================================================================
#
# =============================================================================
# Versioning & release process
# =============================================================================
# Scheme: semantic versioning, `MAJOR.MINOR.PATCH` in versionName
# (gradle.properties: app.versionName, e.g. 7.11.3) and an integer versionCode
# (app.versionCode, e.g. 71133) that must strictly increase with every release
# (F-Droid and Android update checks both rely on it).
#
# Cutting a release:
#   1. Bump app.versionCode + app.versionName in gradle.properties
#      (convention: bump versionCode; it must strictly increase every release).
#   2. Add a fastlane changelog entry:
#      fastlane/metadata/android/en-US/changelogs/<versionCode>.txt (<=500 chars).
#   3. Commit: `chore(release): vX.Y.Z`.
#   4. Tag: `git tag vX.Y.Z && git push origin vX.Y.Z`.
#   5. This workflow builds the signed release APK from the tag, generates a
#      changelog from commits since the previous tag, and publishes a GitHub
#      Release with the APK attached. The tag is the reproducible release point.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64     - base64 of the release keystore file
#                         (create with: base64 -w0 release.keystore)
#   KEYSTORE_PASSWORD   - keystore store password
#   KEY_ALIAS           - key alias inside the keystore
#   KEY_PASSWORD        - key password
# The keystore and passwords must NEVER be committed. The workflow decodes the
# keystore to a temp file and exports the credentials as environment variables,
# which app/build.gradle.kts reads via its env-fallback signingConfig.
# =============================================================================

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version from gradle.properties
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "versionName=$TAG" >> "$GITHUB_OUTPUT"
          # gradle.properties is the source of truth for versionCode
          # (release process step 1: bump it before tagging). The tag must
          # match app.versionName; versionCode must strictly increase.
          PROPS_VERSION="$(grep '^app.versionName=' gradle.properties | cut -d= -f2 | tr -d ' \r')"
          if [ "$TAG" != "$PROPS_VERSION" ]; then
            echo "::error::Tag v$TAG does not match app.versionName=$PROPS_VERSION in gradle.properties. Bump gradle.properties first (release process step 1)."
            exit 1
          fi
          echo "versionCode=$(grep '^app.versionCode=' gradle.properties | cut -d= -f2 | tr -d ' \r')" >> "$GITHUB_OUTPUT"

      - name: Decode keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          ./gradlew assembleRelease --stacktrace
          -Papp.versionCode=${{ steps.version.outputs.versionCode }}
          -Papp.versionName=${{ steps.version.outputs.versionName }}

      - name: Generate changelog from commits
        id: changelog
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..${GITHUB_REF_NAME}"
          else
            RANGE="${GITHUB_REF_NAME}"
          fi
          {
            echo "body<<EOF"
            git log --no-decorate --pretty=format:'- %s' "$RANGE"
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ScribbleX ${{ steps.version.outputs.versionName }}
          body: ${{ steps.changelog.outputs.body }}
          files: app/build/outputs/apk/release/ScribbleX-*.apk
          fail_on_unmatched_files: true
